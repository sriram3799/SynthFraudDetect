# Iceberg catalog configuration for the Flink Iceberg sink.
#
# Dev (MinIO):   catalog.type=hadoop, warehouse=s3://sentinel-dev/iceberg/
# Prod (AWS):    catalog.type=glue,   warehouse=s3://<ICEBERG_BUCKET_NAME>/iceberg/
#
# The active profile is selected at runtime via the ICEBERG_CATALOG_TYPE
# environment variable. Default: hadoop (local dev).

catalog.name=sentinel
catalog.type=${ICEBERG_CATALOG_TYPE:-hadoop}

# Hadoop catalog (dev / MinIO)
warehouse=${ICEBERG_WAREHOUSE:-s3://sentinel-dev/iceberg/}

# S3 FileIO — used by both Hadoop and Glue catalog backends
io-impl=org.apache.iceberg.aws.s3.S3FileIO
s3.endpoint=${S3_ENDPOINT:-http://minio:9000}
s3.path-style-access=true
s3.access-key-id=${AWS_ACCESS_KEY_ID:-minioadmin}
s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:-minioadmin}

# AWS Glue catalog (prod) — only active when catalog.type=glue
glue.region=${AWS_REGION:-us-east-1}
glue.id=${AWS_ACCOUNT_ID:-}
