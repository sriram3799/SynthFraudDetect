include:
  - docker-compose.kafka.yml
  - docker-compose.flink.yml

# MinIO — local S3 substitute for Iceberg dev/test.
# S3 path structure is identical to AWS prod; only the endpoint differs.
# Prod: s3://<ICEBERG_BUCKET_NAME>/iceberg/
# Dev:  s3://sentinel-dev/iceberg/  (endpoint: http://localhost:9000)

services:
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: sentinel-minio
    hostname: minio
    restart: unless-stopped
    networks:
      - sentinel-net
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot sidecar: creates the sentinel-dev bucket in MinIO on stack startup.
  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: sentinel-minio-init
    networks:
      - sentinel-net
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET:-sentinel-dev}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$MINIO_DEFAULT_BUCKET;
      mc mb --ignore-existing local/$$MINIO_DEFAULT_BUCKET/iceberg/transactions;
      mc mb --ignore-existing local/$$MINIO_DEFAULT_BUCKET/iceberg/fraud_alerts;
      echo 'MinIO bucket initialised: '$$MINIO_DEFAULT_BUCKET;
      "
    restart: "no"

volumes:
  minio-data:
    name: sentinel-minio-data
