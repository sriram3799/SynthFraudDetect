sentinel:
  target: dev
  outputs:

    # -----------------------------------------------------------------------
    # dev — reads from local MinIO via DuckDB + Iceberg extension
    # -----------------------------------------------------------------------
    dev:
      type: duckdb
      path: ":memory:"
      extensions:
        - iceberg
        - httpfs
      settings:
        s3_endpoint: "localhost:9000"
        s3_access_key_id: "minioadmin"
        s3_secret_access_key: "minioadmin"
        s3_use_ssl: "false"
        s3_url_style: "path"
        unsafe_enable_version_guessing: "true"
      threads: 4

    # -----------------------------------------------------------------------
    # prod — reads from AWS S3 via DuckDB + Iceberg extension
    # AWS credentials supplied via environment variables (never hardcoded)
    # -----------------------------------------------------------------------
    prod:
      type: duckdb
      path: ":memory:"
      extensions:
        - iceberg
        - httpfs
      settings:
        s3_region: "{{ env_var('AWS_REGION') }}"
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID', '') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY', '') }}"
      threads: 8
